# SonarCloud automatic analysis settings.
# Copy-paste detection skips generated output and synthetic fixtures. The docs
# pages under docs/rules share one HTML template from larc_seraph/docsgen.py, and
# the telemetry samples and converted queries are written by tools/. Their
# duplication is the generator's, not copied code. These paths are still
# analyzed for issues.
sonar.cpd.exclusions=docs/**,telemetry/**,rules/converted/**,tests/fixtures/**

# The positive fixtures of the hidden-Unicode rule hold Unicode tag characters on
# purpose: they are the rule's test inputs, each spells the inert word INERT, and
# the rule exists to find exactly this. SonarCloud rule text:S7628 reports them as
# new vulnerabilities. Only that rule, only in those fixtures.
sonar.issue.ignore.multicriteria=hiddenunicode
sonar.issue.ignore.multicriteria.hiddenunicode.ruleKey=text:S7628
sonar.issue.ignore.multicriteria.hiddenunicode.resourceKey=tests/fixtures/yara/SUSP_SERAPH_Instruction_Hidden_Unicode/positive/**
