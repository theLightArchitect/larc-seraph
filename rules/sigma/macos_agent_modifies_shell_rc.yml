title: macOS agent process modified a user shell rc file
name: SERAPH_MacOS_Agent_Modifies_Shell_RC
id: 93769b4b-6b4b-466d-b19f-89eb0257aa2d
status: experimental
description: >
  A process whose image, or its parent image, matches a known local AI-agent
  host wrote a user shell startup file. That is a common place to hide a
  command that runs in later interactive sessions. Field names are the larc-seraph
  normalized macOS contract.
references:
  - https://attack.mitre.org/techniques/T1546/004/
author: Kevin Francis Tan / Light Architects
date: 2026-11-13
modified: 2026-11-13
license: Detection Rule License 1.1
scope:
  - macOS file events normalized to the larc-seraph field contract
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1546.004
logsource:
  product: macos
  category: file_event
  definition: larc-seraph normalized ESF file event. Image, ParentImage, and TargetFilename are absolute paths.
detection:
  selection_target:
    TargetFilename|endswith:
      - '/.zshrc'
      - '/.zprofile'
      - '/.zshenv'
      - '/.zlogin'
      - '/.bashrc'
      - '/.bash_profile'
      - '/.profile'
      - '/.bash_login'
      - '/.zlogout'
      - '/.config/fish/config.fish'
      - '/.zshrc.local'
      - '/.config/zsh/.zshrc'
      - '/.config/zsh/.zshenv'
      - '/.config/zsh/.zprofile'
      - '/.config/zsh/.zlogin'
  selection_target_omz:
    TargetFilename|contains: '/.oh-my-zsh/custom/'
    TargetFilename|endswith: '.zsh'
  selection_agent_image:
    Image|contains:
      - '/Cursor'
      - '/Claude'
      - '/codex'
      - '/.npm/_npx/'
      - '/Code Helper'
  selection_agent_parent:
    ParentImage|contains:
      - '/Cursor'
      - '/Claude'
      - '/codex'
      - '/.npm/_npx/'
      - '/Code Helper'
  selection_agent_extra_image:
    - Image|contains: '/Windsurf'
    - Image|endswith:
        - '/opencode'
        - '/aider'
        - '/goose'
  selection_agent_extra_parent:
    - ParentImage|contains: '/Windsurf'
    - ParentImage|endswith:
        - '/opencode'
        - '/aider'
        - '/goose'
  condition: (selection_target or selection_target_omz) and 1 of selection_agent_*
falsepositives:
  - An operator asked an agent to add an alias or a PATH entry to their own shell rc.
  - Dotfile tooling whose executable path contains Claude, Cursor, or codex.
level: medium
