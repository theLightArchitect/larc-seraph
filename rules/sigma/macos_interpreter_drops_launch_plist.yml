title: macOS interpreter wrote a LaunchAgent or LaunchDaemon plist
name: SERAPH_MacOS_Interpreter_Drops_Launch_Plist
id: d02261e0-72ff-4943-b615-535f3c525e8f
status: experimental
description: >
  A shell, Python, Node, Bun, Deno, Perl, Ruby, osascript, or curl wrote a plist under LaunchAgents
  or LaunchDaemons. This is the file-drop half of a persistence lead. The
  companion YARA rule inspects whether the plist itself is a rogue job.
  Field names are the larc-seraph normalized macOS contract.
references:
  - https://attack.mitre.org/techniques/T1543/001/
  - https://attack.mitre.org/techniques/T1543/004/
  - https://www.broadcom.com/support/security-center/protection-bulletin/amos-atomic-macos-stealer-malware-deployed-in-latest-clickfix-campaign-targeting-macos-users
author: Kevin Francis Tan / Light Architects
date: 2026-11-13
modified: 2026-11-13
license: Detection Rule License 1.1
scope:
  - macOS file events normalized to the larc-seraph field contract
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.001
  - attack.t1543.004
logsource:
  product: macos
  category: file_event
  definition: larc-seraph normalized ESF file event. Image and TargetFilename are absolute paths.
detection:
  selection_dir:
    TargetFilename|contains:
      - '/Library/LaunchAgents/'
      - '/Library/LaunchDaemons/'
  selection_ext:
    TargetFilename|endswith: '.plist'
  selection_writer_name:
    Image|endswith:
      - '/bash'
      - '/bin/sh'
      - '/zsh'
      - '/python'
      - '/python3'
      - '/node'
      - '/osascript'
      - '/curl'
      - '/perl'
      - '/ruby'
      - '/bun'
      - '/deno'
  selection_writer_versioned:
    Image|contains: '/python3.'
  condition: selection_dir and selection_ext and 1 of selection_writer_*
falsepositives:
  - Installers and Homebrew casks that drop a LaunchAgent from a shell script.
  - An operator scripting their own login job. Correlate with SERAPH-YARA-008 or SERAPH-YARA-009 before escalating.
level: medium
